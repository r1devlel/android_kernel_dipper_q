name: Build Dipper Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: dipper-q-oss
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            cpio \
            python3 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Show toolchain
        run: |
          echo "=== Host ==="
          uname -a

          echo "=== ARM64 GCC ==="
          aarch64-linux-gnu-gcc --version | head -2

          echo "=== Clang ==="
          clang --version | head -3

      - name: Prepare kernel config
        run: |
          make ARCH=arm64 dipper_user_defconfig

      - name: Check generated config
        run: |
          test -f .config
          echo "Kernel config berhasil dibuat."
          grep -E '^CONFIG_(ARM64|QCOM|MSM)' .config | head -30
          
      - name: Bypass legacy GCC wrapper
        run: |
          sed -i 's|scripts/gcc-wrapper.py $(REAL_CC)|$(REAL_CC)|g' Makefile
          sed -i 's|scripts/gcc-wrapper.py|$(REAL_CC)|g' Makefile

          echo "=== GCC configuration ==="
          grep -n "gcc-wrapper\|REAL_CC\|CC =" Makefile | head -30
          
      - name: Build kernel
        run: |
          set -o pipefail
          make -j2 \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS="-fcommon" \
            HOSTCXXFLAGS="-fcommon" \
            V=1 2>&1 | tee build.log
      
      - name: Show build errors
        if: failure()
        run: |
          echo "===== LAST 100 LINES ====="
          tail -100 build.log

      - name: Collect kernel
        run: |
          mkdir -p output

          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb output/
          elif [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image output/
          else
            echo "Kernel image tidak ditemukan!"
            exit 1
          fi

          cp .config output/dipper.config

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: dipper-kernel
          path: output/
