name: Build Dipper Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: dipper-q-oss
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            cpio \
            python3 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Show toolchain
        run: |
          echo "=== Host ==="
          uname -a

          echo "=== ARM64 GCC ==="
          aarch64-linux-gnu-gcc --version | head -2

      - name: Prepare kernel config
        run: |
          make ARCH=arm64 dipper_user_defconfig

      - name: Check generated config
        run: |
          test -f .config
          echo "Kernel config berhasil dibuat."
          grep -E '^CONFIG_(ARM64|QCOM|MSM)' .config | head -30

      - name: Fix legacy GCC wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/gcc-wrapper.py")
          s = p.read_text()

          # Python 2 print -> Python 3
          s = s.replace(
              "print >> sys.stderr, line,",
              "print(line, end='', file=sys.stderr)"
          )

          s = s.replace(
              'print >> sys.stderr, "error, forbidden warning:", m.group(2)',
              'print("warning:", m.group(2), file=sys.stderr)'
          )

          # Make GCC stderr text instead of bytes.
          s = s.replace(
              "stderr=subprocess.PIPE, universal_newlines=True, universal_newlines=True",
              "stderr=subprocess.PIPE, universal_newlines=True"
          )

          s = s.replace(
              "stderr=subprocess.PIPE",
              "stderr=subprocess.PIPE, universal_newlines=True"
          )

          # Remove duplicate argument if it somehow remains.
          while "universal_newlines=True, universal_newlines=True" in s:
              s = s.replace(
                  "universal_newlines=True, universal_newlines=True",
                  "universal_newlines=True"
              )

          # Legacy wrapper treats unknown warnings as fatal.
          # Change that behavior so warnings are printed but don't abort.
          marker = "        sys.exit(1)"
          if marker in s:
              s = s.replace(marker, "        return", 1)

          p.write_text(s)
          PY

          echo "=== CHECK GCC WRAPPER ==="
          grep -n "Popen" scripts/gcc-wrapper.py
          grep -n "print" scripts/gcc-wrapper.py

          echo "=== PYTHON SYNTAX CHECK ==="
          python3 -m py_compile scripts/gcc-wrapper.py

      - name: Build kernel
        run: |
          set -o pipefail

          make -j2 \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS="-fcommon" \
            HOSTCXXFLAGS="-fcommon" \
            V=1 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          echo "===== LAST 100 LINES ====="
          tail -100 build.log

      - name: Collect kernel
        run: |
          mkdir -p output

          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb output/
          elif [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image output/
          else
            echo "Kernel image tidak ditemukan!"
            exit 1
          fi

          cp .config output/dipper.config

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: dipper-kernel
          path: output/
