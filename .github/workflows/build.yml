```yaml
name: Build Dipper Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: dipper-q-oss
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            cpio \
            python3 \
            git \
            make

      - name: Download Android Clang toolchain
        run: |
          git clone --depth=1 \
            https://github.com/kdrag0n/proton-clang.git \
            $GITHUB_WORKSPACE/proton-clang

      - name: Prepare config
        run: |
          make ARCH=arm64 dipper_user_defconfig

      - name: Build kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"

          make -j"$(nproc)" \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Collect kernel
        run: |
          mkdir -p output

          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb output/
          elif [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image output/
          else
            echo "Kernel image tidak ditemukan!"
            exit 1
          fi

          cp .config output/dipper.config

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: dipper-kernel
          path: output/
```
