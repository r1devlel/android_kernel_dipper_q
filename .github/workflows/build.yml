name: Build Dipper Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: dipper-q-oss
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            cpio \
            python3 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Show toolchain
        run: |
          echo "=== Host ==="
          uname -a

          echo "=== ARM64 GCC ==="
          aarch64-linux-gnu-gcc --version | head -2

          echo "=== Clang ==="
          clang --version | head -3

      - name: Prepare kernel config
        run: |
          make ARCH=arm64 dipper_user_defconfig

      - name: Check generated config
        run: |
          test -f .config
          echo "Kernel config berhasil dibuat."
          grep -E '^CONFIG_(ARM64|QCOM|MSM)' .config | head -30
          
      - name: Make GCC wrapper Python 3 compatible
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/gcc-wrapper.py")
          s = p.read_text()

          s = s.replace(
              "print >> sys.stderr, line,",
              "print(line, end='', file=sys.stderr)"
          )

          s = s.replace(
              'print >> sys.stderr, "error, forbidden warning:", m.group(2)',
              'print("error, forbidden warning:", m.group(2), file=sys.stderr)'
          )

          s = s.replace(
              "stderr=subprocess.PIPE",
              "stderr=subprocess.PIPE, universal_newlines=True"
          )

          s = s.replace(
              "stdout=subprocess.PIPE",
              "stdout=subprocess.PIPE, universal_newlines=True"
          )

          p.write_text(s)
          PY

          echo "=== patched gcc-wrapper.py ==="
          grep -n "print" scripts/gcc-wrapper.py
          grep -n "subprocess" scripts/gcc-wrapper.py

      - name: Ignore GCC array-bounds warning
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/gcc-wrapper.py")
          s = p.read_text()

          old = "def interpret_warning(line):"
          new = """def interpret_warning(line):
              if '[-Warray-bounds]' in line:
                  return
          """

          if old not in s:
              raise SystemExit("interpret_warning() tidak ditemukan")

          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          sed -n '45,70p' scripts/gcc-wrapper.py

      - name: Patch legacy GCC wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/gcc-wrapper.py")
          s = p.read_text()

          # Python 2 print -> Python 3
          s = s.replace(
              "print >> sys.stderr, line,",
              "print(line, end='', file=sys.stderr)"
          )

          s = s.replace(
              'print >> sys.stderr, "error, forbidden warning:", m.group(2)',
              'print("warning:", m.group(2), file=sys.stderr)'
          )

          # subprocess bytes -> text
          s = s.replace(
              "stderr=subprocess.PIPE",
              "stderr=subprocess.PIPE, universal_newlines=True"
          )

          # Disable legacy forbidden-warning exit.
          s = s.replace(
              "        sys.exit(1)",
              "        return",
              1
          )

          p.write_text(s)
          PY

          echo "=== wrapper patched ==="
          sed -n '45,90p' scripts/gcc-wrapper.py


      - name: Build kernel
        run: |
          set -o pipefail
          make -j2 \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS="-fcommon" \
            HOSTCXXFLAGS="-fcommon" \
            KCFLAGS="-Wno-array-bounds" \
            V=1 2>&1 | tee build.log
      
      - name: Show build errors
        if: failure()
        run: |
          echo "===== LAST 100 LINES ====="
          tail -100 build.log

      - name: Collect kernel
        run: |
          mkdir -p output

          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb output/
          elif [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image output/
          else
            echo "Kernel image tidak ditemukan!"
            exit 1
          fi

          cp .config output/dipper.config

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: dipper-kernel
          path: output/
