name: Build Dipper Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: dipper-q-oss
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio gcc g++ make python3

      - name: Prepare kernel config
        run: |
          make ARCH=arm64 dipper_user_defconfig

      - name: Build kernel
        run: |
          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Collect kernel
        run: |
          mkdir -p output
          cp arch/arm64/boot/Image.gz-dtb output/ 2>/dev/null || true
          cp arch/arm64/boot/Image output/ 2>/dev/null || true

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: dipper-kernel
          path: output/
